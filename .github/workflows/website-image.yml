name: Website image

on:
  push:
    branches: [main]
    paths:
      - apps/website/package.json  # an image is built once per version of the site
      - .github/workflows/website-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/miiajs/miia-website

jobs:
  image:
    runs-on: ubuntu-latest
    # A pushed version tag is deployed, so only main publishes one
    if: github.ref == 'refs/heads/main'
    # Actions are pinned to commit SHAs: a moved tag cannot run other code with this job's packages:write token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: version
        run: |
          version=$(jq -r .version apps/website/package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::apps/website/package.json has no x.y.z version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        # Any other error fails the job, so a failed check cannot overwrite a published tag
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "value=true" >> "$GITHUB_OUTPUT"
          elif grep -q ': not found$' <<<"$out"; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        if: steps.published.outputs.value == 'false'
        with:
          context: .
          file: apps/website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      - env:
          VERSION: ${{ steps.version.outputs.value }}
          PUBLISHED: ${{ steps.published.outputs.value }}
        run: |
          if [[ "$PUBLISHED" == 'true' ]]; then
            echo "\`$IMAGE:$VERSION\` is already published, nothing was built" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built \`$IMAGE:$VERSION\` from \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          fi
