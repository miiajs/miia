name: Website image

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - packages/core/package.json  # the site shows its version
      - bun.lock
      - package.json
      - .dockerignore
      - .github/workflows/website-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    # Actions are pinned to commit SHAs: a moved tag cannot run other code with this job's packages:write token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: apps/website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/miiajs/miia-website:${{ github.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      - run: echo "Image \`ghcr.io/miiajs/miia-website:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
