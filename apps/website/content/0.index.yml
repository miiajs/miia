title: MiiaJS
description: Controllers, modules, dependency injection and guards on native TC39 decorators and the Web Request/Response API.
seo:
  title: MiiaJS - Decorator-Driven HTTP Framework for TypeScript
  description: Build structured, type-safe HTTP APIs with native decorators, dependency injection, and Koa-style middleware. Deploy to Bun, Deno, Node.js, or any serverless/edge platform.
navigation: false
hero:
  # The second line is drawn in the dimmed color
  title: |-
    Structured TypeScript APIs.
    Any runtime.
  description: Controllers, modules, dependency injection and guards on native TC39 decorators and the Web Request/Response API.
  links:
    - label: Read the docs
      to: /docs/getting-started
      color: neutral
architecture:
  title: Familiar patterns, modern foundation.
  description: 'The architecture you know from Angular and NestJS - controllers, modules, DI and Koa-style middleware - rebuilt from scratch on native decorators and Web Standards.'
  link:
    label: Coming from NestJS
    to: /docs/getting-started/coming-from-nest
  features:
    - title: Decorators that just work
      description: '@Controller, @Get, @Injectable, @Module - the TC39 decorator standard. No reflect-metadata, no experimental flags, no setup.'
    - title: Web Standards first
      description: 'Request in, Response out. ctx.req is the standard Request, a handler can return a standard Response, and no Express or Fastify sits underneath.'
    - title: Koa-style middleware
      description: One middleware concept replaces interceptors, pipes and filters. Easier to learn, easier to compose.
runtimes:
  title: Runs wherever Request and Response do.
  description: MiiaJS is built on Web Standards. Your app is a fetch handler, so the entry point is the only line that changes from one runtime to another.
  tested:
    - Bun
    - Deno
    - Node.js
    - Cloudflare Workers
packages:
  title: What an API needs, as separate packages.
  description: The core stays small. Install only what you use.
  link:
    label: All packages
    to: /docs/packages
  items:
    - title: Dependency injection
      description: 'A container per app with inject(). Singleton, transient and request scopes; module boundaries checked at startup.'
      packages: '@miiajs/core'
    - title: Validation
      description: 'Body, query and params schemas on the route decorator. Any Zod-like schema; failures become a 422.'
      packages: '@miiajs/core'
    - title: Auth
      description: AuthProvider, AuthGuard and token extractors, plus a JWT sign and verify service.
      packages: '@miiajs/auth · @miiajs/jwt'
    - title: Databases
      description: 'Drizzle for PostgreSQL, MySQL and SQLite; Mongoose and Papr for MongoDB.'
      packages: '@miiajs/drizzle · mongoose · papr'
    - title: OpenAPI
      description: An OpenAPI 3.1 spec generated from your routes and schemas, with Swagger UI.
      packages: '@miiajs/swagger'
    - title: Messaging
      description: A decorator-driven event bus with typed event contracts, retry and DLQ, and a Redis Streams transport.
      packages: '@miiajs/messaging · messaging-redis'
    - title: Rate limiting
      description: Fixed-window limits as a guard, per-route decorators or perimeter middleware, with pluggable stores.
      packages: '@miiajs/rate-limit'
    - title: CLI and testing
      description: 'Scaffolding, generators, dev server and builds; a TestApp harness for integration tests.'
      packages: '@miiajs/cli · @miiajs/testing'
performance:
  title: Measured with the full stack on.
  # The page appends the runtime, the machine and the date of the run from app/data/benchmarks
  description: 'The heaviest test in the suite: CORS, JWT, JSON body, path and query params, custom headers, UUID and a 201 status.'
  link:
    label: All results, Node.js and Deno included
    to: /benchmarks
start:
  title: Start a project.
  description: The CLI scaffolds an app with a module, a controller and a test, on the runtime you pick. Then add a database, auth or a CRUD resource with one command.
  links:
    - label: Quick Start
      to: /docs/getting-started/quick-start
      color: neutral
    - label: GitHub
      to: https://github.com/miiajs/miia
      target: _blank
      icon: i-lucide-arrow-up-right
      trailing: true
      color: neutral
      variant: outline
