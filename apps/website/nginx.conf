server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Location carries only the path; behind Traefik nginx would otherwise write http://<host>:8080 into it
    absolute_redirect off;

    # /docs/intro -> docs/intro/index.html; HTML and payloads are revalidated on every visit
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }

    # File names under /_nuxt/ carry a content hash; a chunk gone after a deploy is a plain 404, not an error log line
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The redirects of routeRules in nuxt.config.ts; a static site has no server to answer them
    location = /docs { return 301 /docs/getting-started; }
    location = /docs/ { return 301 /docs/getting-started; }
    location = /docs/core-concepts/static-files { return 301 /docs/packages/serve-static; }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    # text/html is always compressed; .xml goes out as text/xml; the wasm is the SQLite of client-side content queries
    gzip_types text/plain text/css text/xml application/javascript application/json application/wasm image/svg+xml;
}
