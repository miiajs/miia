services:
  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 5
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - '6385:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 5
